# WG-Gesucht filter + message configuration.
#
# The search URL is the page you land on after applying all your filters on
# wg-gesucht.de. Open the site, set your filters (city, price, rooms, dates,
# ...), apply them, then copy the resulting URL here.
#
# Credentials are NOT stored here. They are read from environment variables
# (WG_EMAIL / WG_PASSWORD), which come from GitHub Actions secrets or a local
# .env file.

# The "applied filter" results URL from wg-gesucht.de.
search_url: "https://www.wg-gesucht.de/wg-zimmer-und-1-zimmer-wohnungen-und-wohnungen-in-Muenchen.90.0+1+2.1.0.html?categories%5B%5D=0&categories%5B%5D=1&categories%5B%5D=2&rent_types%5B%5D=2&rent_range=0%2C1100&min_rent=0&max_rent=1100&offer_filter=1&city_id=90&sort_column=3&sort_order=0&noDeact=1&rMax=1100&radAdd=Leibregimentsweg+++M%C3%BCnchen&radLat=48.1432010811405&radLng=11.579006290969335&exContAds=1"

# How many of the newest listings to contact per run.
# dedupe (below) guarantees nobody is messaged twice, so a higher number just
# reaches more *new* landlords each run. Note: sending very many messages in a
# short time can trigger WG-Gesucht's spam protection. ~30/run is conservative;
# 50/run (with the 5s pause between sends) is more aggressive.
max_listings_per_run: 50

# How many search-result pages to scan (each page has ~20-30 listings).
# The bot stops early if a page returns no more results.
max_pages: 20

# Dedupe is handled server-side by WG-Gesucht's "exContAds=1" filter in the
# search URL (kontaktierte Anzeigen herausfiltern). Local tracking not needed.
dedupe: false

# Path to the message body sent to landlords. The placeholder {recipient}
# is replaced with the listing owner's name when available.
message_file: "message.txt"
